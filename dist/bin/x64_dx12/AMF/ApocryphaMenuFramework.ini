; ============================================================================
; ApocryphaRealm Menu Framework - settings.
;
; F1 opens the framework as its own centred window; uToggleKey=0 gives the key
; back to the game. The Witcher 3 build adds no row to the game's own menus.
;
; WHERE YOUR SETTINGS GO. This file holds the defaults and is never written.
; Settings you change in the menu are saved to User.ini beside this file
; (bin\x64_dx12\AMF\User.ini), which holds only what you changed and wins over
; this file; layout presets go in AMF\Presets. The download never contains
; either, so an update cannot replace them (under Mod Organizer 2 they are in
; overwrite). To set something by hand, edit User.ini - or this file, for
; anything you have not changed in the menu. Delete User.ini to go back to
; these defaults. The log says which file each setting came from.
; ============================================================================

[Menus]
; Not on The Witcher 3: this build adds no row to the game's own menus, so this value
; does nothing here. The menu opens from its key (uToggleKey, F1).
bSystemMenuRow=1

[Input]
; DirectInput scan code that toggles the framework menu, decimal or hex: 59 (0x3B) = F1.
; 0 = no key at all, which is the way to leave F1 entirely to the game. The same key as
; Controls > Open and close the menu; a code no key can have falls back to F1.
uToggleKey=59
; 1 = the on-screen keyboard for controller players: highlight a text box and press A,
; and a key grid appears across the bottom of the screen; the D-pad walks it, A types,
; B goes back to the box. 0 turns it off.
bOnScreenKeyboard=1
; Keyboard or controller navigation is DETECTED from whatever you last used, and is
; not a setting: press a key or move the mouse for keyboard navigation, touch the
; pad for controller navigation. The menu shows which one it is reading.

[Menu]
; 1 = pause the game while this menu is open. Not working on The Witcher 3 yet: the
; game keeps running behind the menu whatever this says.
bPauseGame=0
; Not used on The Witcher 3.
bKeepCameraAwake=1

[Display]
; Extra text scale on top of the automatic resolution scaling.
fTextScale=1.3
; See-through window (0/1): on, uWindowOpacity below fades the menu's background (100 = solid,
; the default). Off: the background is always solid.
bSeeThrough=1
; How solid the menu is, in percent (5-100): 100 is solid, lower lets the game show through. The
; black background fades by the full amount, boxes and borders much less, text least; right-click
; menus stay solid.
uWindowOpacity=100
; Optional .ttf to rasterise the menu text from. Empty = a clean system font.
; Fonts dropped into AMF\fonts are listed on the settings page.
sFontPath=
; Language of the framework's own text: empty = the game's text language, set in its own
; options (your Windows language if AMF has no file for it); or a translation file's name -
; english, german, french, spanish, italian, russian, polish, czech, japanese, korean,
; chinese (AMF\Translations\ApocryphaMenuFramework_<language>.txt).
sLanguage=
; Window position preset. 0 = centre: where the menu opens until it is moved (bMovable).
uWindowPreset=0

[Window]
; Move the window (0/1): on, drag its top row (the name and version) to move it, and it opens where it
; was left. Off: it sits in the middle of the screen. On is the default.
bMovable=1
; Resize the window (0/1): on, drag any edge or corner to resize it, freely. Off: its size is fixed.
; On is the default.
bFreeResize=1
; Where the menu window was left (fHotkey*), as FRACTIONS of the screen so the numbers
; stay right at any resolution. -1 means it has never been moved, so it opens in the
; centre of the screen. Move or resize it and it is remembered here; the settings page
; can reset it. The fNested* keys and sNestedArt belong to a row in the game's own menu,
; which The Witcher 3 build does not have; they are not used here.
fNestedX=-1
fNestedY=-1
fNestedW=-1
fNestedH=-1
sNestedArt=
fHotkeyX=-1
fHotkeyY=-1
fHotkeyW=-1
fHotkeyH=-1

[Watchdog]
; If the menu renderer stops producing frames for uSeconds the game is treated as
; hung and closes itself - no Task Manager needed. 0 or bEnabled=0 disables it.
bEnabled=1
uSeconds=120

[FastExit]
; When the game exits, end the process at once instead of running every DLL's and
; driver's shutdown code - the phase where a closing game can get stuck beyond any kill.
; Saves and settings are written when you save or change them, not at exit. 0 disables.
bEnabled=1

[Screenshot]
; Where the Screenshot control (Controls; F11 / View while this menu is open) saves a PNG of
; what the screen shows, this menu included (Steam's own F12 screenshot shows the menu too).
; Empty = Documents\The Witcher 3\AMF Screenshots.
sFolder=

[Theme]
; Registry id of the active theme: oathvein (the default - grey lines, charcoal and blood red),
; untarnished (plain), veldun (bone lines on warm brown), norden (slate lines and silver on
; grey) or norden-black (the same on black). oblivion (an embroidered map's edge in gold and
; brown on parchment) and skyrim (the Nordic knotwork look) are the framework's other builds'
; looks. Drop a theme INI into AMF\themes to add your own (the shipped ones show the keys);
; a theme's own art draws whenever that theme is picked.
sThemeId=oathvein

[Skin]
; Replacement ARTWORK for the menu shell, for a UI author matching their own
; interface. Every image is a 32-bit RGBA PNG - DDS is not decoded. All optional.
;
; bEnabled is the master switch and is OFF by default: with it off nothing below is
; even loaded and the menu keeps its built-in look, whatever the paths say. Turn it
; on only when you actually have artwork to point it at. There is a matching switch
; on the Framework Settings page, so it can be turned off without editing this file.
;   sFrame       one square PNG with a TRANSPARENT CENTRE, drawn as a nine-slice
;                around the window. 192x192 with 64px corners is a good default.
;   uFrameCorner how many pixels of that PNG are the corner ornament.
;   sBackground  a small tileable PNG (<=512px each side) OR a full-screen one -
;                which it is is decided by its own size, so both just work.
;   sPlates      a FOLDER holding any of toggle.png, slider.png, tab.png, to restyle
;                individual controls. Supply only the ones you want changed.
; Paths are relative to bin\x64_dx12 (AMF/themes/YourTheme/frame.png), or absolute while working.
bEnabled=0
sFrame=
uFrameCorner=64
sBackground=
sPlates=

[Log]
; 0 = trace (everything, for a bug report), 1 = debug, 2 = info (the default), 3 = warning, 4 = error, 5 = critical, 6 = off.
uLogLevel=2

[Bindings]
; The framework's own controls, one line per function:
;   s<Function>=<keyKind>,<keyCode>,<padKind>,<padCode>
; keyKind 0 = none, 1 = keyboard (DirectInput scan code), 2 = mouse button (0 = left).
; padKind 0 = none, 1 = pad button (XInput mask; L3 = 64, R3 = 128), 2 = stick direction
;         (code = stick * 16 + direction; stick 0 = left, 1 = right; direction 0 = up,
;          1 = down, 2 = left, 3 = right).
; Set these from Controls in the menu - its two tabs capture the key or button you press.
; Only the functions you changed are written to User.ini; the rest are the shipped defaults.
; The keyboard key of sToggleMenu is the menu key, [Input] uToggleKey; uToggleKey wins if they differ.
sToggleMenu=1,59,0,-1
sClose=1,1,1,16
sUp=1,200,1,1
sDown=1,208,1,2
sLeft=1,203,1,4
sRight=1,205,1,8
sActivate=1,28,1,4096
sBack=1,14,1,8192
sPaneLeft=0,-1,2,2
sPaneRight=0,-1,2,3
sOskShift=0,-1,1,16384
sOskBackspace=0,-1,1,32768
sOskDone=0,-1,1,32
sTabPrev=1,201,1,256
sTabNext=1,209,1,512
sContextMenu=0,-1,1,32768
sFavourite=1,33,1,64
sGrabMod=0,-1,1,128
sGrabUp=0,-1,2,16
sGrabDown=0,-1,2,17
sScreenshot=1,87,1,32
