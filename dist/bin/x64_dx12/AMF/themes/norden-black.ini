; Apocrypha Menu Framework theme - Norden - Black.
; Norden with its panel grey taken to black, the same rule as our Norden UI - Black recolour: the
; #333333 panel becomes black, lines, text and highlights stay Norden's. Uses the Norden art in norden/.
[Theme]
sName=Norden - Black
sBackground=#000000
sFrame=#BBBDBF
sBorder=#8E9396
sText=#E5E5E5
sTextDim=#999999
sAccent=#BBBDBF
; 1.0.5: section headings and help text (Appearance > Colours can change them)
sTextHeader=#C9D6E3
sTextHelp=#8FB3CF
fBorderThickness=1.0
bKnotwork=0
sSkinFrame=AMF/themes/norden/frame.png
uSkinFrameCorner=26
; no background art: the plain panel colour (1.0.5, as Skyrim 2.1.6 - the owner: every theme but Oblivion has the plain background)
sSkinPlates=AMF/themes/norden
; 1.0.5 (Skyrim 2.1.6's art library): the theme's art parts, by name, from AMF\assets\<kind>\ - here Norden's own frame.
; Appearance > Art picks any other part per theme. sSkinFrame above stays as the fallback if the library file is missing.
; No background art: the plain panel colour (as Skyrim 2.1.6: every theme but Oblivion has the plain background).
sFrameArt=norden
; 1.0.5 (Skyrim 2.1.6): the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on
; Appearance > Art is the same look as picking this theme's name there. What can be selected (boxes, buttons, tick
; boxes, tabs, switches, slider tracks) has no frame of its own in these parts - the hover frame goes round it.
sToggleArt=norden
sKnobArt=norden
sBoxArt=norden
sButtonArt=norden
sTickBoxArt=norden
sSliderArt=norden
sScrollbarArt=norden
sSectionArt=norden
sTabArt=norden
sArrowArt=norden
sCursorArt=norden
sSliderTrackArt=norden
sScrollTrackArt=norden
