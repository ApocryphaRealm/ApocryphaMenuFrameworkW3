; Apocrypha Menu Framework theme - Skellige.
; The Witcher 3 build's default (the owner, 2026-10-05: "set the background color for Oath Vein to a black color matching
; the main menu. And let's call it Skellige theme"). It began as Oathvein - made to sit beside Oathvein UI (Nithog, Nexus
; 160916): thin grey lines and a blood-red highlight - and now stands on the black of the game's own main menu column,
; sampled from it. The art in skellige\ was drawn for AMF; no files from Oathvein UI or the game are included.
[Theme]
sName=Skellige
sBackground=#020203
sFrame=#A6A8A7
sBorder=#A6A8A7
sText=#E8E8E8
sTextDim=#8C8C8C
sAccent=#8E2A2E
; 1.0.5: section headings and help text (Appearance > Colours can change them)
sTextHeader=#C8686C
sTextHelp=#A8AEB5
fBorderThickness=1.0
bKnotwork=0
sSkinFrame=AMF/themes/skellige/frame.png
uSkinFrameCorner=26
sSkinPlates=AMF/themes/skellige
; 1.0.5 (Skyrim 2.1.6's art library): the theme's art parts, by name, from AMF\assets\<kind>\ - here the Oathvein frame - the same art Skellige has drawn since it began as Oathvein, so it looks as before.
; Appearance > Art picks any other part per theme. sSkinFrame above stays as the fallback if the library file is missing.
; No background art: the plain panel colour (as Skyrim 2.1.6: every theme but Oblivion has the plain background).
sFrameArt=oathvein
