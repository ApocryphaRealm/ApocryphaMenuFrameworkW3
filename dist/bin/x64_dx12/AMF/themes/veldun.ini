; Apocrypha Menu Framework theme - Vel'dun.
; Made to sit beside Vel'dun UI (Nithog, Nexus 176230): its bone line colour, warm dark panel and tan
; headings, taken from Vel'dun UI's own ImGui style. The art in veldun\ was drawn for AMF; no files
; from Vel'dun UI are included, and Vel'dun UI is not required.
[Theme]
sName=Vel'dun
sBackground=#1D1A17
sFrame=#D1C7AE
sBorder=#D1C7AE
sText=#E4DDCC
sTextDim=#A39C8A
sAccent=#AAA07A
; 1.0.5: section headings and help text (Appearance > Colours can change them)
sTextHeader=#CDBF8E
sTextHelp=#A8B9B5
fBorderThickness=1.0
bKnotwork=0
sSkinFrame=AMF/themes/veldun/frame.png
uSkinFrameCorner=26
; no background art: the plain panel colour (1.0.5, as Skyrim 2.1.6 - the owner: every theme but Oblivion has the plain background)
sSkinPlates=AMF/themes/veldun
; 1.0.5 (Skyrim 2.1.6's art library): the theme's art parts, by name, from AMF\assets\<kind>\ - here Vel'dun's own frame.
; Appearance > Art picks any other part per theme. sSkinFrame above stays as the fallback if the library file is missing.
; No background art: the plain panel colour (as Skyrim 2.1.6: every theme but Oblivion has the plain background).
sFrameArt=veldun
; 1.0.5 (Skyrim 2.1.6): the rest of the theme's own parts - its namesakes in every kind, so "Theme's own" on
; Appearance > Art is the same look as picking this theme's name there. What can be selected (boxes, buttons, tick
; boxes, tabs, switches, slider tracks) has no frame of its own in these parts - the hover frame goes round it.
sToggleArt=veldun
sKnobArt=veldun
sBoxArt=veldun
sButtonArt=veldun
sTickBoxArt=veldun
sSliderArt=veldun
sScrollbarArt=veldun
sSectionArt=veldun
sTabArt=veldun
sArrowArt=veldun
sCursorArt=veldun
sSliderTrackArt=veldun
sScrollTrackArt=veldun
